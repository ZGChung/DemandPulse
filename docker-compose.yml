# DemandPulse - run with Docker Compose
# 1. Copy .env.example to .env and set NEXTAUTH_SECRET (required), DATABASE_URL (optional).
# 2. docker compose up --build
# For SQLite persistence, mount a volume and set DATABASE_URL=file:/app/data/dev.db

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
