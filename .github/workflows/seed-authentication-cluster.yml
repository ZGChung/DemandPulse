name: Seed Authentication Cluster

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Seed authentication cluster
        run: node scripts/seed-authentication-cluster.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
