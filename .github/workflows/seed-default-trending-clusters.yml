name: Seed Default Trending Clusters

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Seed default trending clusters
        run: node scripts/seed-default-trending-clusters.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
