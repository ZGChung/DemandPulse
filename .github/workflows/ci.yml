name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Prisma client
      run: npx prisma generate
    
    - name: Create .prisma/client symlink
      run: mkdir -p .prisma && ln -sf node_modules/.prisma/client .prisma/client
    
    - name: Run linting
      run: npm run lint --if-present
    
    - name: Run tests
      run: npm test
    
    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Prisma client
      run: |
        echo "Generating Prisma client..."
        npx prisma generate
        echo "Prisma client generation completed"
        echo "Checking generated files..."
        ls -la node_modules/.prisma/ || echo "node_modules/.prisma not found"
    
    - name: Create .prisma/client symlink
      run: |
        echo "Creating .prisma/client symlink..."
        mkdir -p .prisma
        ln -sf node_modules/.prisma/client .prisma/client
        echo "Symlink created:"
        ls -la .prisma/
    
    - name: Check environment before build
      run: |
        echo "=== ENVIRONMENT CHECK ==="
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        echo "Current directory: $(pwd)"
        echo "Checking Prisma client..."
        ls -la node_modules/.prisma/ || echo "node_modules/.prisma not found"
        echo "Checking .prisma symlink..."
        ls -la .prisma/ || echo ".prisma directory not found"
        echo "Checking TypeScript configuration..."
        cat tsconfig.json | grep -A5 -B5 "\.prisma/client"
    
    - name: Build application with Vercel
      run: |
        # Enable debug output
        set -x
        
        # Install Vercel CLI
        echo "Installing Vercel CLI..."
        npm install --global vercel@latest
        
        # Build with Vercel
        echo "Running: vercel build --prod"
        vercel build --prod
        
        echo "Checking if .vercel/output directory was created..."
        if [ -d ".vercel/output" ]; then
          echo "SUCCESS: .vercel/output directory exists"
          echo "Contents of .vercel/output/:"
          ls -la .vercel/output/
          
          # Check if .vercel/output directory is empty
          if [ -z "$(ls -A .vercel/output/)" ]; then
            echo "WARNING: .vercel/output directory is empty!"
            echo "Build may have failed silently."
            exit 1
          else
            echo "SUCCESS: .vercel/output directory contains files"
          fi
        else
          echo "FAILURE: .vercel/output directory was not created"
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          exit 1
        fi
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
    
    - name: Verify build output
      run: ls -la .vercel/output/ || echo "No .vercel/output directory found"
    
    - name: Upload build artifacts for Vercel deployment
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          .
          !node_modules
          !.git
        retention-days: 7
        include-hidden-files: true
        if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository (for git info)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Download build artifacts for Vercel deployment
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: ./
    
    - name: Verify downloaded build artifacts
      run: |
        echo "=== VERIFYING DOWNLOADED BUILD ARTIFACTS ==="
        echo "Current directory: $(pwd)"
        echo "Directory contents:"
        ls -la
        echo "Checking if .vercel/output directory exists:"
        ls -la .vercel/output/ 2>/dev/null || echo ".vercel/output directory not found"
        echo "Checking package.json:"
        cat package.json
    
    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod --prebuilt'
        working-directory: .
    
    - name: Run database migrations
      run: |
        echo "Running Prisma migrations..."
        echo "DATABASE_URL is set: ${#DATABASE_URL} characters"
        npx prisma migrate deploy
        echo "Migrations completed"
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run security audit
      run: npm audit --audit-level=high || true
    
    - name: Check for secrets
      uses: gitleaks/gitleaks-action@v2
    
    - name: Dependency review
      uses: actions/dependency-review-action@v3
      if: github.event_name == 'pull_request'