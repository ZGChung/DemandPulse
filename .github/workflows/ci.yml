name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    - name: Generate Prisma client
      run: npx prisma generate
    
    - name: Create .prisma/client symlink
      run: mkdir -p .prisma && ln -sf node_modules/.prisma/client .prisma/client
    
    - name: Run linting
      run: npm run lint --if-present
    
    - name: Run tests
      run: npm test
    
    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        fail_ci_if_error: false

    

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    - name: Generate Prisma client
      run: npx prisma generate
    
    - name: Create .prisma/client symlink
      run: mkdir -p .prisma && ln -sf node_modules/.prisma/client .prisma/client
    
    - name: Build project
      run: npm run build
    
    - name: Deploy to Vercel
      run: |
        npx vercel@latest deploy --prod --token=${{ secrets.VERCEL_TOKEN }} \
          --scope=${{ secrets.VERCEL_ORG_ID }}
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
    
    - name: Run database migrations
      run: |
        echo "Running Prisma migrations..."
        echo "DATABASE_URL is set: ${#DATABASE_URL} characters"
        npx prisma migrate deploy
        echo "Migrations completed"
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Run security audit
      run: npm audit --audit-level=high || true
    
    - name: Check for secrets
      uses: gitleaks/gitleaks-action@v2
    
    - name: Dependency review
      uses: actions/dependency-review-action@v3
      if: github.event_name == 'pull_request'