name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create .prisma/client symlink
        run: mkdir -p .prisma && ln -sf node_modules/.prisma/client .prisma/client

      - name: Run linting
        run: npm run lint --if-present

      - name: Run tests
        run: npm test

      - name: Upload test coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create .prisma/client symlink
        run: mkdir -p .prisma && ln -sf node_modules/.prisma/client .prisma/client

      - name: Check environment before build
        run: |
          echo "=== ENVIRONMENT CHECK ==="
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Current directory: $(pwd)"
          echo "Checking Prisma client..."
          ls -la node_modules/.prisma/ || echo "node_modules/.prisma not found"
          echo "Checking .prisma symlink..."
          ls -la .prisma/ || echo ".prisma directory not found"

      - name: Build application
        run: |
          set -x
          echo "Running: npm run build"
          npm run build

          echo "Checking if .next directory was created..."
          if [ -d ".next" ]; then
            echo "SUCCESS: .next directory exists"
            ls -la .next/
            if [ -z "$(ls -A .next/)" ]; then
              echo "WARNING: .next directory is empty!"
              exit 1
            fi
          else
            echo "FAILURE: .next directory was not created"
            exit 1
          fi
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'sk-build-placeholder' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'file:./prisma/dev.db' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'build-secret' }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}

      - name: Verify build output
        run: ls -la .next/ || echo "No .next directory found"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create .prisma/client symlink
        run: mkdir -p .prisma && ln -sf node_modules/.prisma/client .prisma/client

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        continue-on-error: true
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: .

      - name: Run database migrations
        run: |
          echo "Running Prisma migrations with failed-migration remediation..."
          node scripts/remediate-organizations-migration.mjs
          echo "Migrations completed"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check license compliance
        run: npx license-checker-evergreen --summary
        continue-on-error: true

      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
