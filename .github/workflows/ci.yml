name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Prisma client
      run: npx prisma generate
    
    - name: Create .prisma/client symlink
      run: mkdir -p .prisma && ln -sf node_modules/.prisma/client .prisma/client
    
    - name: Run linting
      run: npm run lint --if-present
    
    - name: Run tests
      run: npm test
    
    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Prisma client
      run: |
        echo "Generating Prisma client..."
        npx prisma generate
        echo "Prisma client generation completed"
        echo "Checking generated files..."
        ls -la node_modules/.prisma/ || echo "node_modules/.prisma not found"
    
    - name: Create .prisma/client symlink
      run: |
        echo "Creating .prisma/client symlink..."
        mkdir -p .prisma
        ln -sf node_modules/.prisma/client .prisma/client
        echo "Symlink created:"
        ls -la .prisma/
    
    - name: Check environment before build
      run: |
        echo "=== ENVIRONMENT CHECK ==="
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        echo "Current directory: $(pwd)"
        echo "Checking Prisma client..."
        ls -la node_modules/.prisma/ || echo "node_modules/.prisma not found"
        echo "Checking .prisma symlink..."
        ls -la .prisma/ || echo ".prisma directory not found"
        echo "Checking TypeScript configuration..."
        cat tsconfig.json | grep -A5 -B5 "\.prisma/client"
    
    - name: Build application
      run: |
        echo "=== STARTING BUILD ==="
        echo "Current directory: $(pwd)"
        echo "Initial directory contents:"
        ls -la
        
        echo "=== RUNNING NEXT.JS BUILD ==="
        # Run build and capture exit code
        BUILD_EXIT_CODE=0
        npm run build --verbose || BUILD_EXIT_CODE=$?
        echo "Build exit code: $BUILD_EXIT_CODE"
        
        echo "=== CHECKING BUILD RESULTS ==="
        echo "Directory contents after build:"
        ls -la
        
        echo "Checking for .next directory..."
        if [ -d ".next" ]; then
          echo "✓ .next directory exists"
          echo ".next directory contents:"
          ls -la .next/
          echo "=== BUILD SUCCESS ==="
          exit 0
        else
          echo "✗ ERROR: .next directory was not created by build"
          echo "Build exit code was: $BUILD_EXIT_CODE"
          echo "Checking node_modules/.prisma directory:"
          ls -la node_modules/.prisma/ || echo "node_modules/.prisma not found"
          echo "=== BUILD FAILED ==="
          exit 1
        fi
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
    
    - name: Verify build output
      run: ls -la .next/ || echo "No .next directory found"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: .next/
        retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: .next/
    
    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'
    
    - name: Run database migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run security audit
      run: npm audit --audit-level=high || true
    
    - name: Check for secrets
      uses: gitleaks/gitleaks-action@v2
    
    - name: Dependency review
      uses: actions/dependency-review-action@v3