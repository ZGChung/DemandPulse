name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Prisma client
      run: npx prisma generate
    
    - name: Create .prisma/client symlink
      run: mkdir -p .prisma && ln -sf node_modules/.prisma/client .prisma/client
    
    - name: Run linting
      run: npm run lint --if-present
    
    - name: Run tests
      run: npm test
    
    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Prisma client
      run: |
        echo "Generating Prisma client..."
        npx prisma generate
        echo "Prisma client generation completed"
        echo "Checking generated files..."
        ls -la node_modules/.prisma/ || echo "node_modules/.prisma not found"
    
    - name: Create .prisma/client symlink
      run: |
        echo "Creating .prisma/client symlink..."
        mkdir -p .prisma
        ln -sf node_modules/.prisma/client .prisma/client
        echo "Symlink created:"
        ls -la .prisma/
    
    - name: Check environment before build
      run: |
        echo "=== ENVIRONMENT CHECK ==="
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        echo "Current directory: $(pwd)"
        echo "Checking Prisma client..."
        ls -la node_modules/.prisma/ || echo "node_modules/.prisma not found"
        echo "Checking .prisma symlink..."
        ls -la .prisma/ || echo ".prisma directory not found"
        echo "Checking TypeScript configuration..."
        cat tsconfig.json | grep -A5 -B5 "\.prisma/client"
    
    - name: Build application
      run: |
        # Enable debug output
        set -x
        
        # Simple build with explicit failure
        echo "Running: npm run build"
        npm run build
        
        echo "Checking if .next directory was created..."
        if [ -d ".next" ]; then
          echo "SUCCESS: .next directory exists"
          echo "Contents of .next/:"
          ls -la .next/
          
          # Check if .next directory is empty
          if [ -z "$(ls -A .next/)" ]; then
            echo "WARNING: .next directory is empty!"
            echo "Build may have failed silently."
            exit 1
          else
            echo "SUCCESS: .next directory contains files"
          fi
        else
          echo "FAILURE: .next directory was not created"
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          exit 1
        fi
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
    
    - name: Verify build output
      run: ls -la .next/ || echo "No .next directory found"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Get full git history for Vercel
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Prisma client
      run: npx prisma generate
    
    - name: Create .prisma/client symlink
      run: mkdir -p .prisma && ln -sf node_modules/.prisma/client .prisma/client
    
    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'
        working-directory: .
    
    - name: Run database migrations
      run: |
        echo "Running Prisma migrations..."
        echo "DATABASE_URL is set: ${#DATABASE_URL} characters"
        npx prisma migrate deploy
        echo "Migrations completed"
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run security audit
      run: npm audit --audit-level=high || true
    
    - name: Check for secrets
      uses: gitleaks/gitleaks-action@v2
    
    - name: Dependency review
      uses: actions/dependency-review-action@v3
      if: github.event_name == 'pull_request'